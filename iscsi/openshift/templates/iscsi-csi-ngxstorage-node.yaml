apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ngxstorage.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: iscsi-csi-ngxstorage
    app.kubernetes.io/component: node
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iscsi-csi-ngxstorage
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iscsi-csi-ngxstorage
        app.kubernetes.io/component: node
      # Pin the custom SCC (created in
      # iscsi-csi-ngxstorage-rbac.yaml) so the node pod never falls back to the
      # cluster-wide privileged SCC. The SCC grants hostNetwork/PID/IPC for
      # host block-device discovery and SYS_ADMIN+SYS_CHROOT for the /host mount
      # and chroot wrappers.
      annotations:
        openshift.io/required-scc: {{ include "ngxstorage.fullname" . }}-node-scc
    spec:
      serviceAccountName: {{ include "ngxstorage.fullname" . }}-node
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # Keep host PID, network, and IPC namespaces for host block-device
      # discovery and chrooted mount operations.
      hostPID: true
      hostNetwork: true
      hostIPC: true
      nodeSelector:
        kubernetes.io/os: linux
        {{- if eq .Values.nodePlacement "worker" }}
        node-role.kubernetes.io/worker: ""
        {{- else if eq .Values.nodePlacement "master" }}
        node-role.kubernetes.io/master: ""
        {{- end }}
      tolerations:
        - operator: Exists
      containers:
        - name: node-driver-registrar
          image: {{ .Values.sidecars.csiNodeDriverRegistrar }}
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/{{ include "ngxstorage.driverName" . }}/csi.sock
            - --v=2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe }}
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=0.0.0.0:{{ .Values.nodeLivenessPort }}
            - --probe-timeout=3s
            - --v=2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: iscsi-csi-ngxstorage
          image: {{ include "ngxstorage.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint=unix:///csi/csi.sock
            # Every process carries the Kubernetes node name it runs on; the
            # role flag tells a per-node worker from the cluster controller.
            - --role=node
            - --nodeid=$(KUBE_NODE_NAME)
            - --ip=$(STORAGE_IPS)
            - --pool-name=$(STORAGE_POOL_NAME)
            {{- if .Values.secret.portalGroup }}
            - --portal-group=$(PORTAL_GROUP)
            {{- end }}
            - --api-key=$(STORAGE_API_KEY)
            - --log={{ .Values.logLevel }}
            {{- if .Values.driverNamePrefix }}
            # Advertise a distinct CSI identity for this backend so multiple
            # driver instances can coexist on one cluster.
            - --driver-prefix={{ .Values.driverNamePrefix }}
            {{- end }}
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NGX_COORDINATION_LEASE_PREFIX
              value: {{ include "ngxstorage.fullname" . | quote }}
            - name: NGX_COORDINATION_SHARD_COUNT
              value: {{ (.Values.coordination.shardCount | default 128) | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: STORAGE_IPS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: storage-ips
            - name: STORAGE_POOL_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: pool-name
            {{- if .Values.secret.portalGroup }}
            - name: PORTAL_GROUP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: portal-group
            {{- end }}
            - name: STORAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: api-key
            - name: NGXSTORAGE_CSI_LOG_DIR
              value: "/host/var/log/ngxstorage/iscsi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.nodeLivenessPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            # Mounts are executed through the image's /host chroot wrappers.
            privileged: true
            readOnlyRootFilesystem: true
            capabilities:
              add: ["SYS_CHROOT", "SYS_ADMIN"]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kube-api-access-ngxstorage
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: host-root
              mountPath: /host
              mountPropagation: Bidirectional
            - name: host-dev
              mountPath: /dev
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/{{ include "ngxstorage.driverName" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: kube-api-access-ngxstorage
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
