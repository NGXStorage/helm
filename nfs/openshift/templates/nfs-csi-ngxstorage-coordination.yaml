{{- $fullName := include "ngxstorage.fullname" . -}}
{{- $count := int (.Values.coordination.shardCount | default 128) -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-coordination-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nfs-csi-ngxstorage
    app.kubernetes.io/component: coordination-config
    app.kubernetes.io/instance: {{ $fullName }}
immutable: true
data:
  lease-prefix: {{ $fullName | quote }}
  shard-count: {{ $count | quote }}
{{- range $i := until $count }}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ printf "%s-operation-lock-%03d" $fullName $i }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: nfs-csi-ngxstorage
    app.kubernetes.io/component: operation-lock
    app.kubernetes.io/instance: {{ $fullName }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-controller-operation-lock
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames:
{{- range $i := until $count }}
      - {{ printf "%s-operation-lock-%03d" $fullName $i }}
{{- end }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-controller-operation-lock
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullName }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-controller-operation-lock
