apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ngxstorage.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health-check
      image: curlimages/curl:8.12.1
      command: ["/bin/sh", "-ec"]
      args:
        - >-
          curl --fail --silent --show-error --retry 15 --retry-delay 2
          --retry-connrefused --max-time 10
          http://{{ include "ngxstorage.fullname" . }}-controller-health:{{ .Values.controllerLivenessPort }}/healthz
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
